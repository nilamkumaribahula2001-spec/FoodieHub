
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub - Create Account</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="restaurant-panel">
            <div class="brand">
                <span>🍽️</span> FoodieHub
            </div>

            <div class="restaurant-content">
                <span class="welcome-tag">JOIN FOODIEHUB</span>

                <h1>Good Food.<br>Good Mood.</h1>

                <p>
                    Create your account and enjoy delicious
                    food delivered to your doorstep.
                </p>

                <div class="food-photo">
                    <img
                        src="https://images.unsplash.com/photo-1547592180-85f173990554?w=900"
                        alt="Delicious restaurant food">
                </div>

                <div class="restaurant-note">
                    ✨ Made with love, served with happiness.
                </div>
            </div>
        </div>

        <div class="login-right">

            <div class="login-top">FoodieHub Account</div>

            <h2>Create Account</h2>

            <p class="login-subtitle">
                Sign up to start your food journey.
            </p>

            <form id="signupForm">

                <label>Full Name</label>
                <input type="text" id="signupName"
                    placeholder="Enter your full name" required>

                <label>Email Address</label>
                <input type="email" id="signupEmail"
                    placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" id="signupPassword"
                    placeholder="Create a password" minlength="6" required>

                <button type="submit">
                    Create Account →
                </button>

            </form>

            <p class="signup-text">
                Already have an account?
                <a href="login.html">Login Here</a>
            </p>

            <a href="index.html" class="home-link">
                ← Back to Home
            </a>

        </div>
    </div>

    <script src="signup.js"></script>

</body>
</html>
